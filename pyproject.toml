[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mcts"
version = "0.1.0"
description = "Jev-guided Monte Carlo tree search for VirtualHome tasks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
virtualhome = [
  "gym==0.26.2",
  "networkx>=2.8,<3",
  "scipy>=1.10",
  "requests>=2.31",
  "ipdb>=0.13",
  "opencv-python-headless>=4.8,<4.12",
  "pillow>=10",
  "profilehooks>=1.12",
  "termcolor>=2",
]

[project.scripts]
jev-mcts = "jev_mcts.cli:main"

[tool.setuptools.packages.find]
include = ["jev_mcts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
